name: Test

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

defaults:
  run:
    shell: pwsh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: macos-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for GitVersion

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: "5.x"

      - name: Build and test (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          & ./build.ps1 -ResolveDependency -Tasks build, test *>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Build and test (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          & ./build.ps1 -ResolveDependency -Tasks build, test *>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Report failures as annotations
        if: failure()
        shell: pwsh
        run: |
          $results = Get-ChildItem -Path output/testResults -Filter *.xml -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $results)
          {
              [xml] $xml = Get-Content -Path $file.FullName -Raw
              $failed = $xml.SelectNodes('//test-case[@result="Failure" or @result="Failed"]') | Select-Object -First 15
              foreach ($case in $failed)
              {
                  $message = ("$($case.name): $($case.failure.message)" -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
                  Write-Output "::error title=Test failed::$message"
              }
          }
          if (Test-Path -Path build.log)
          {
              $tail = (Get-Content -Path build.log -Tail 80) -join "`n"
              $tail = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              Write-Output "::error title=Build log tail::$tail"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: output/testResults/
          if-no-files-found: ignore
