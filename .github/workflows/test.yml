name: Test

on:
  pull_request:
  push:
    branches-ignore: # publish.yml runs the tests for these branches
      - main
      - dev
  workflow_call:

defaults:
  run:
    shell: pwsh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for GitVersion

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: "5.x"

      - name: Build and test
        run: |
          & ./build.ps1 -ResolveDependency -Tasks build, test *>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Report failures as annotations
        if: failure()
        shell: pwsh
        run: |
          $results = Get-ChildItem -Path output/testResults -Filter *.xml -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $results)
          {
              [xml] $xml = Get-Content -Path $file.FullName -Raw
              $failed = $xml.SelectNodes('//test-case[@result="Failure" or @result="Failed"]') | Select-Object -First 15
              foreach ($case in $failed)
              {
                  $message = ("$($case.name): $($case.failure.message)" -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
                  Write-Output "::error title=Test failed::$message"
              }
          }
          if (Test-Path -Path build.log)
          {
              $esc = [char] 27
              $lines = Get-Content -Path build.log | ForEach-Object -Process { $_ -replace "$esc\[[0-9;]*m", '' }
              $hits = for ($i = 0; $i -lt $lines.Count; $i++)
              {
                  if ($lines[$i] -match '\[-\]|Exception|Error:|Expected|failed|at <ScriptBlock>|, .*\.ps1:\d+')
                  {
                      $lines[$i]
                  }
              }
              $text = ($hits | Select-Object -Unique | Select-Object -First 70) -join "`n"
              $text = $text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              Write-Output "::error title=Pester errors::$text"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: output/testResults/
          if-no-files-found: ignore
