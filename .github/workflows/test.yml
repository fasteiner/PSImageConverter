name: Test

on:
  pull_request:
  push:
    branches-ignore: # publish.yml runs the tests for these branches
      - main
      - dev
  workflow_call:

defaults:
  run:
    shell: pwsh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for GitVersion

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: "5.x"

      # The module writes HEIC with the encoder of the operating system; on Linux that is the libheif of
      # the distribution with its x265 plugin, so the Linux encoder path runs in CI. The macOS runner has
      # ImageIO, the Windows runner has no HEVC Video Extensions (the tests of the missing encoder run there).
      # PSIC_EXPECT_HEIC_ENCODER makes a test fail when the encoder installed here does not work, instead of
      # letting every HEIC test be skipped.
      - name: Install libheif with the x265 HEVC encoder
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y libheif1 libheif-plugin-x265
          echo "PSIC_EXPECT_HEIC_ENCODER=1" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./build.ps1 -ResolveDependency -Tasks build, test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: output/testResults/
          if-no-files-found: ignore
